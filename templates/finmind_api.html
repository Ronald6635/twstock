<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinMind API 儀表板 - 台灣證券交易所股票網路應用</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .nav-link { display: inline-block; padding: 10px 15px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
        .nav-link:hover { background-color: #45a049; }

        .user-info-panel { background-color: #f0f0f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }

        .api-selector { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .api-selector select, .api-selector input, .api-selector button {
            padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;
        }
        .api-selector button { background-color: #2196F3; color: white; cursor: pointer; }
        .api-selector button:hover { background-color: #0b7dda; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .data-panel { background-color: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; }
        .data-panel h3 { margin-top: 0; color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 8px; }

        .chart-container { min-height: 400px; display: flex; justify-content: center; align-items: center; }
        .chart-container img { max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px; }

        .table-container { max-height: 400px; overflow-y: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th, .data-table td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        .data-table th { background-color: #f5f5f5; font-weight: bold; }
        .data-table tr:hover { background-color: #f9f9f9; }

        .loading { text-align: center; color: #666; padding: 40px; }
        .error { color: #f44336; background-color: #ffebee; padding: 10px; border-radius: 4px; margin: 10px 0; }

        .api-categories { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .category-btn { padding: 8px 16px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 20px; }
        .category-btn.active { background-color: #4CAF50; color: white; border-color: #4CAF50; }
        .category-btn:hover { background-color: #f0f0f0; }

        .api-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; }
        .api-item { padding: 10px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: white; font-size: 13px; text-align: center; }
        .api-item:hover { background-color: #f5f5f5; border-color: #2196F3; }
        .api-item.selected { background-color: #e3f2fd; border-color: #2196F3; }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .api-selector { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>FinMind API 儀表板</h1>
            <a href="/" class="nav-link">← 返回主頁面</a>
        </div>

        <div class="user-info-panel">
            <strong>FinMind 使用統計:</strong> <span id="usage">載入中...</span>
        </div>

        <div class="api-selector">
            <select id="api-category">
                <option value="technical">技術面分析</option>
                <option value="chip">籌碼面分析</option>
                <option value="fundamental">基本面分析</option>
                <option value="derivatives">衍生性金融商品</option>
                <option value="other">其他數據</option>
            </select>

            <input type="text" id="stock-id" placeholder="股票代碼 (e.g., 2330)" value="2330">
            <input type="date" id="start-date" value="2024-01-01">
            <input type="date" id="end-date" value="2024-12-31">
            <button id="fetch-btn">取得資料</button>
            <label><input type="checkbox" id="auto-refresh"> 自動更新</label>
        </div>

        <div class="dashboard-grid">
            <div class="data-panel">
                <h3>API 選擇</h3>
                <div id="api-list-container">
                    <div class="loading">載入 API 列表中...</div>
                </div>
            </div>

            <div class="data-panel">
                <h3>資料檢視</h3>
                <div id="data-display">
                    <div class="loading">請選擇 API 並點擊「取得資料」</div>
                </div>
            </div>

            <div class="data-panel">
                <h3>圖表視覺化</h3>
                <div id="chart-display" class="chart-container">
                    <div class="loading">圖表將在此顯示</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API 定義
        const apiDefinitions = {
            technical: [
                { id: 'stock_info', name: '台股總覽', endpoint: '/api/finmind/stock_info', params: [], dataset: 'TaiwanStockInfo' },
                { id: 'daily', name: '台灣股價資料表', endpoint: '/api/finmind/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockPrice' },
                { id: 'trading_days', name: '台股交易日', endpoint: '/api/finmind/trading_days', params: [], dataset: 'TaiwanStockTradingDays' },
                { id: 'sector_price', name: '台灣類股股價表', endpoint: '/api/finmind/sector_price/{sector}', params: ['sector'], dataset: 'TaiwanStockSectorPrice' },
                { id: 'per', name: '個股 PER、PBR 資料表', endpoint: '/api/finmind/per/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockPER' },
                { id: 'index', name: '台股加權指數', endpoint: '/api/finmind/index', params: [], dataset: 'TaiwanStockIndex' },
                { id: 'index_return', name: '加權、櫃買報酬指數', endpoint: '/api/finmind/index_return', params: [], dataset: 'TaiwanStockIndexReturn' },
                { id: 'weekly', name: '台股週線', endpoint: '/api/finmind/weekly/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockPrice' },
                { id: 'monthly', name: '台股月線', endpoint: '/api/finmind/monthly/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockPrice' }
            ],
            chip: [
                { id: 'margin', name: '個股融資融券表', endpoint: '/api/finmind/margin/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockMarginPurchaseShortSale' },
                { id: 'margin_total', name: '整體市場融資融券表', endpoint: '/api/finmind/margin_total', params: [], dataset: 'TaiwanStockTotalMarginPurchaseShortSale' },
                { id: 'institutional', name: '個股三大法人買賣表', endpoint: '/api/finmind/institutional/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockInstitutionalInvestorsBuySell' },
                { id: 'institutional_total', name: '整體三大市場法人買賣表', endpoint: '/api/finmind/institutional_total', params: [], dataset: 'TaiwanStockTotalInstitutionalInvestors' },
                { id: 'holders', name: '外資持股表', endpoint: '/api/finmind/holders/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockHoldingSharesPer' },
                { id: 'securities_lending', name: '借券成交明細', endpoint: '/api/finmind/securities_lending/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockSecuritiesLending' }
            ],
            fundamental: [
                { id: 'cash_flow', name: '現金流量表', endpoint: '/api/finmind/cash_flow/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockCashFlowsStatement' },
                { id: 'income_statement', name: '綜合損益表', endpoint: '/api/finmind/income_statement/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockFinancialStatements' },
                { id: 'balance_sheet', name: '資產負債表', endpoint: '/api/finmind/balance_sheet/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockBalanceSheet' },
                { id: 'dividend', name: '股利政策表', endpoint: '/api/finmind/dividend/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockDividend' },
                { id: 'ex_dividend', name: '除權除息結果表', endpoint: '/api/finmind/ex_dividend/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockDividendResult' },
                { id: 'revenue', name: '月營收表', endpoint: '/api/finmind/revenue/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockMonthRevenue' },
                { id: 'delisted', name: '台股下市資料表', endpoint: '/api/finmind/delisted', params: [], dataset: 'TaiwanStockDelisted' },
                { id: 'split', name: '台股分割後參考價', endpoint: '/api/finmind/split/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockSplit' },
                { id: 'face_value_change', name: '台灣股票變更面額恢復買賣參考價格', endpoint: '/api/finmind/face_value_change/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockFaceValueChange' }
            ],
            derivatives: [
                { id: 'futures_options_daily', name: '期貨、選擇權日成交資訊總覽', endpoint: '/api/finmind/futures_options_daily', params: [], dataset: 'TaiwanFuturesAndOptionsDaily' },
                { id: 'futures_daily', name: '期貨日成交資訊', endpoint: '/api/finmind/futures_daily', params: [], dataset: 'TaiwanFuturesDaily' },
                { id: 'options_daily', name: '選擇權日成交資訊', endpoint: '/api/finmind/options_daily', params: [], dataset: 'TaiwanOptionsDaily' },
                { id: 'futures_institutional', name: '期貨三大法人買賣', endpoint: '/api/finmind/futures_institutional', params: [], dataset: 'TaiwanFuturesInstitutionalInvestorsBuySell' },
                { id: 'options_institutional', name: '選擇權三大法人買賣', endpoint: '/api/finmind/options_institutional', params: [], dataset: 'TaiwanOptionsInstitutionalInvestorsBuySell' }
            ],
            other: [
                { id: 'news', name: '相關新聞', endpoint: '/api/finmind/news/{stock_id}', params: ['stock_id'], dataset: 'TaiwanStockNews' },
                { id: 'gold_price', name: '黃金價格表', endpoint: '/api/finmind/gold_price', params: [], dataset: 'GoldPrice' },
                { id: 'crude_oil_price', name: '原油資料表', endpoint: '/api/finmind/crude_oil_price', params: [], dataset: 'CrudeOilPrice' },
                { id: 'us_stock', name: '美股股價', endpoint: '/api/finmind/us_stock/{stock_id}', params: ['stock_id'], dataset: 'USStockPrice' },
                { id: 'exchange_rate', name: '外幣對台幣資料表', endpoint: '/api/finmind/exchange_rate', params: [], dataset: 'TaiwanExchangeRate' },
                { id: 'central_bank_rate', name: '央行利率資料表', endpoint: '/api/finmind/central_bank_rate', params: [], dataset: 'CentralBankInterestRate' },
                { id: 'us_treasury_yield', name: '美國國債表', endpoint: '/api/finmind/us_treasury_yield', params: [], dataset: 'USTreasuryYield' },
                { id: 'user_info', name: '用戶資訊', endpoint: '/api/finmind/user_info', params: [], dataset: null }
            ]
        };

        let selectedApi = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            updateApiList();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('fetch-btn').addEventListener('click', fetchData);
            // 添加對 api-category select 的 change 事件監聽器
            document.getElementById('api-category').addEventListener('change', function() {
                updateApiList();
            });
        }

        function updateApiList() {
            const categorySelect = document.getElementById('api-category');
            const category = categorySelect.value; // 獲取當前選擇的類別值

            const apis = apiDefinitions[category] || [];

            // 動態生成 API 列表（附上可存取且有意義的 tooltip 與 aria-label）
            const apiDescriptions = {
                stock_info: '台股總覽：列出所有上市股票的代碼與基本資訊。',
                daily: '個股日線：取得指定股票的日線價格 (open/high/low/close) 與成交量。',
                trading_days: '交易日：台股交易日曆，供日期計算與範圍檢查使用。',
                sector_price: '類股股價：取得特定類別的股票價格資料。',
                per: 'PER/PBR：個股近一年本益比與股價淨值比資料。',
                index: '加權指數：台灣加權指數歷史指數資料。',
                index_return: '指數報酬：加權與櫃買報酬指數資料。',
                weekly: '週線：將日線彙整為週 OHLC（含成交量）。',
                monthly: '月線：將日線彙整為月 OHLC（含成交量）。',
                margin: '融資融券：個股融資、融券交易資料。',
                margin_total: '市場融資融券：整體市場融資與融券概況。',
                institutional: '三大法人：個股三大法人買賣資料（近三個月）。',
                institutional_total: '三大法人總覽：整體市場法人買賣彙總。',
                holders: '外資持股：外資持股比例與變動資料。',
                securities_lending: '借券成交：借券成交明細與數量。',
                cash_flow: '現金流量表：公司現金流量報表（財報）。',
                income_statement: '綜合損益表：公司損益相關財報資料。',
                balance_sheet: '資產負債表：公司資產負債表資料。',
                dividend: '股利政策：公司股利發放與配息資料。',
                ex_dividend: '除權除息：除權除息結果與時間資訊。',
                revenue: '月營收：公司每月營收時間序列資料。',
                delisted: '下市資料：已下市或退市股票資訊。',
                split: '股票分割：分割後的參考價格資料。',
                face_value_change: '面額變更：公司面額變更相關資料。',
                futures_options_daily: '期貨/選擇權日成交：期權與期貨當日成交彙總。',
                futures_daily: '期貨日成交：期貨每日逐筆或日線資料。',
                options_daily: '選擇權日成交：選擇權每日逐筆或日線資料。',
                futures_institutional: '期貨法人：期貨市場三大法人買賣資料。',
                options_institutional: '選擇權法人：選擇權市場法人買賣資料。',
                news: '相關新聞：與個股相關的新聞清單。',
                gold_price: '黃金價格：高頻黃金價格 (GoldPrice) 時間序列。',
                crude_oil_price: '原油價格：Brent/WTI 原油日價格。',
                us_stock: '美股日線：美股歷史價格資料（含圖表）。',
                exchange_rate: '匯率：主要外幣對台幣匯率資料。',
                central_bank_rate: '央行利率：主要央行利率時間序列。',
                us_treasury_yield: '美國國債：不同年期美國國債殖利率資料。',
                translation: '欄位翻譯：資料欄位對應的中文翻譯，供表格顯示使用。',
                user_info: '用戶資訊：即時顯示 API 使用量與限制（實時，不快取）。'
            };

            const apiListContainer = document.getElementById('api-list-container');
            apiListContainer.innerHTML = apis.map(api => {
                const desc = apiDescriptions[api.id] || '';
                const paramsText = api.params && api.params.length ? '參數: ' + api.params.join(', ') + '；' : '';
                const datasetText = api.dataset ? '資料集: ' + api.dataset + '；' : '';
                const title = `${api.name} — ${desc} ${paramsText}${datasetText}Endpoint: ${api.endpoint}`;
                return `<div class="api-item" data-api-id="${api.id}" title="${title}" aria-label="${title}" onclick="selectApi('${api.id}')">${api.name}</div>`;
            }).join('');

            // 清除之前的選擇
            selectedApi = null;
            document.querySelectorAll('.api-item').forEach(item => item.classList.remove('selected'));
        }

        function selectApi(apiId) {
            // 清除之前的選擇
            document.querySelectorAll('.api-item').forEach(item => item.classList.remove('selected'));

            // 選擇新的 API
            const selectedItem = document.querySelector(`[data-api-id="${apiId}"]`);
            selectedItem.classList.add('selected');

            // 找到對應的 API 定義
            const category = document.getElementById('api-category').value;
            selectedApi = apiDefinitions[category].find(api => api.id === apiId);
        }

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/finmind/user_info');
                const data = await response.json();
                console.log('User info response:', data); // Debug log
                if (data.error) {
                    document.getElementById('usage').textContent = '無法載入統計資料';
                } else {
                    // Try different possible field names
                    const userCount = data.user_count || data.api_count || data.count || 0;
                    const limit = data.api_request_limit || data.limit || data.api_limit || 600;
                    document.getElementById('usage').textContent =
                        `已使用: ${userCount} / 上限: ${limit}`;
                }
            } catch (error) {
                console.error('User info error:', error); // Debug log
                document.getElementById('usage').textContent = '載入失敗';
            }
        }

        async function fetchData() {
            if (!selectedApi) {
                showError('請先選擇一個 API');
                return;
            }

            const stockId = document.getElementById('stock-id').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            // 構建 endpoint
            let endpoint = selectedApi.endpoint;
            if (selectedApi.params.includes('stock_id')) {
                endpoint = endpoint.replace('{stock_id}', stockId);
            }
            if (selectedApi.params.includes('sector')) {
                // 對於類股，可以從 stock_id 中提取或使用默認值
                endpoint = endpoint.replace('{sector}', stockId.substring(0, 2) || '01');
            }

            // 添加日期參數（如果有選擇日期）
            const urlParams = new URLSearchParams();
            if (startDate) urlParams.append('start_date', startDate);
            if (endDate) urlParams.append('end_date', endDate);

            const queryString = urlParams.toString();
            if (queryString) {
                endpoint += '?' + queryString;
            }

            document.getElementById('data-display').innerHTML = '<div class="loading">載入中...</div>';
            document.getElementById('chart-display').innerHTML = '<div class="loading">生成圖表中...</div>';

            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                if (data.error) {
                    showError(`錯誤: ${data.error}`);
                    return;
                }

                // 獲取翻譯資料
                let translations = {};
                if (selectedApi.dataset) {
                    try {
                        const translationResponse = await fetch(`/api/finmind/translation/${selectedApi.dataset}`);
                        if (translationResponse.ok) {
                            translations = await translationResponse.json();
                        }
                    } catch (translationError) {
                        console.log('無法獲取翻譯資料:', translationError);
                    }
                }

                // 顯示數據
                if (data.data) {
                    renderTable(data.data, translations);
                } else if (Array.isArray(data)) {
                    renderTable(data, translations);
                } else {
                    renderTable([data], translations);
                }

                // 顯示圖表
                if (data.chart_image) {
                    document.getElementById('chart-display').innerHTML =
                        `<img src="data:image/png;base64,${data.chart_image}" alt="Chart">`;
                } else {
                    document.getElementById('chart-display').innerHTML = '<div class="loading">此 API 無圖表</div>';
                }

            } catch (error) {
                showError(`網路錯誤: ${error.message}`);
            }
        }

        function renderTable(data, translations = {}) {
            if (!Array.isArray(data) || data.length === 0) {
                document.getElementById('data-display').innerHTML = '<div class="loading">無資料</div>';
                return;
            }

            const columns = Object.keys(data[0]);
            // Fallback zh-tw map for common FinMind columns
            const fallbackMap = {
                'Trading_Volume': '成交量',
                'Trading_money': '成交金額',
                'Trading_turnover': '成交筆數',
                'close': '收盤價',
                'date': '日期',
                'max': '最高價',
                'min': '最低價',
                'open': '開盤價',
                'spread': '漲跌',
                'stock_id': '股票代碼'
            };
            const tableHtml = `
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                ${columns.map(col => {
                                    let chineseName = translations[col];
                                    if (!chineseName || chineseName === col) {
                                        chineseName = fallbackMap[col] || col;
                                    }
                                    return `<th title="${col}">${chineseName}</th>`;
                                }).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${data.slice(0, 100).map(row => `
                                <tr>
                                    ${columns.map(col => `<td>${row[col] || ''}</td>`).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${data.length > 100 ? `<p style="text-align: center; color: #666;">顯示前 100 筆，共 ${data.length} 筆</p>` : ''}
                </div>
            `;

            document.getElementById('data-display').innerHTML = tableHtml;
        }

        function showError(message) {
            document.getElementById('data-display').innerHTML = `<div class="error">${message}</div>`;
            document.getElementById('chart-display').innerHTML = '<div class="loading">圖表將在此顯示</div>';
        }

        // 每 30 秒自動更新用戶資訊
        setInterval(loadUserInfo, 30000);
    </script>
</body>
</html>
