<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinMind 股票儀表板</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        /* Additional styles for fuzzy search suggestions */
        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            width: calc(100% - 2px);
            z-index: 1000;
            display: none;
        }
        .suggestion-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .suggestion-item:hover, .suggestion-item:focus {
            background: #f0f0f0;
        }
        .stock-input-container {
            position: relative;
        }
    </style>
<body>
    <div class="container" style="max-width: 1400px;">
        <h1>📊 FinMind 股票分析儀表板</h1>
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/" style="text-decoration: none; color: #3498db;">← 回到首頁</a>
        </div>

        <div class="user-info-panel" style="margin-bottom: 20px; padding: 10px; background-color: #f0f0f0; border-radius: 8px;">
            <strong>FinMind 使用統計:</strong> <span id="usage">載入中...</span>
        </div>
        
        <form method="POST" class="controls" id="dashboard-form">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center;">
                <div class="stock-input-container">
                    <label for="stock_id">股票代碼/名稱：</label>
                    <input type="text" id="stock_id" name="stock_id" value="{{ stock_id or '2379' }}" required style="width: 80px;" autocomplete="off" aria-describedby="stock-help" aria-expanded="false" aria-haspopup="listbox" role="combobox">
                    <div class="suggestions" id="suggestions" role="listbox" aria-label="Stock suggestions"></div>
                </div>
                <div>
                    <label for="start_date">開始日期：</label>
                    <input type="date" id="start_date" name="start_date" value="{{ start_date or '2025-01-01' }}" required>
                </div>
                <div>
                    <label for="end_date">結束日期：</label>
                    <input type="date" id="end_date" name="end_date" value="{{ end_date or '2026-01-07' }}" required>
                </div>
                <button type="submit" style="padding: 10px 25px;">即時產生分析圖表</button>
            </div>
            <div id="stock-help" style="text-align: center; margin-top: 5px; font-size: 0.9em; color: #666;">
                輸入股票代碼或名稱，系統將提供模糊搜尋建議。
            </div>
        </form>
        
        {% if chart_html %}
        <div class="chart-container" style="margin-top: 30px; border: 1px solid #eee; border-radius: 8px; overflow: hidden;">
            {{ chart_html|safe }}
            
            <!-- Dedicated row for Seasonal EPS and Gross Profit (backward-filled) -->
            {% if financial_chart_html %}
            <div style="border-top: 1px solid #eee;">
                {{ financial_chart_html|safe }}
            </div>
            {% endif %}
        </div>

        <div style="text-align:center; margin-top:10px;">
            <label style="margin-right:8px;"><input type="checkbox" id="force_refresh"> 強制重新抓取（force refresh）</label>
            <button id="save_button" type="button" style="padding: 8px 18px;">💾 存檔</button>
            <span id="save_status" style="margin-left:12px; color:#333;"></span>
        </div>
        <p style="text-align:center; color:#666; font-size:0.9em; margin-top:8px;">平均月營收/交易日 = 月營收 ÷ 該月份的交易日數（僅計算有交易日的月份）</p>
        {% endif %}
    </div>

    <script>
        // Embed stock data from tw_stock_info.json for fuzzy search
        const stockData = {{ stock_data | tojson }};
        
        // Fuzzy search function (simple substring + Levenshtein-like matching)
        function fuzzySearch(query, data, limit = 10) {
            if (!query) return [];
            const lowerQuery = query.toLowerCase();
            return data
                .filter(stock => 
                    stock.stock_id.toLowerCase().includes(lowerQuery) || 
                    (stock.stock_name && stock.stock_name.toLowerCase().includes(lowerQuery))
                )
                .sort((a, b) => {
                    // Prioritize exact ID matches, then name matches
                    const aIdMatch = a.stock_id.toLowerCase().startsWith(lowerQuery);
                    const bIdMatch = b.stock_id.toLowerCase().startsWith(lowerQuery);
                    if (aIdMatch && !bIdMatch) return -1;
                    if (!aIdMatch && bIdMatch) return 1;
                    return a.stock_id.localeCompare(b.stock_id);
                })
                .slice(0, limit);
        }
        
        // Debounce function to limit search frequency
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // Update suggestions on input
        const stockInput = document.getElementById('stock_id');
        const suggestionsDiv = document.getElementById('suggestions');
        
        const updateSuggestions = debounce(() => {
            const query = stockInput.value.trim();
            const matches = fuzzySearch(query, stockData);
            
            suggestionsDiv.innerHTML = '';
            if (matches.length > 0) {
                matches.forEach((stock, index) => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.textContent = `${stock.stock_id} - ${stock.stock_name || 'N/A'}`;
                    item.setAttribute('role', 'option');
                    item.setAttribute('tabindex', '0');
                    item.addEventListener('click', () => {
                        stockInput.value = stock.stock_id;
                        suggestionsDiv.style.display = 'none';
                        stockInput.focus();
                    });
                    item.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            item.click();
                        }
                    });
                    suggestionsDiv.appendChild(item);
                });
                suggestionsDiv.style.display = 'block';
                stockInput.setAttribute('aria-expanded', 'true');
            } else {
                suggestionsDiv.style.display = 'none';
                stockInput.setAttribute('aria-expanded', 'false');
            }
        }, 300);
        
        stockInput.addEventListener('input', updateSuggestions);
        stockInput.addEventListener('focus', updateSuggestions);
        
        // Hide suggestions on outside click
        document.addEventListener('click', (e) => {
            if (!stockInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
                suggestionsDiv.style.display = 'none';
                stockInput.setAttribute('aria-expanded', 'false');
            }
        });
        
        async function loadUserInfo() {
            try {
                const resp = await fetch('/api/finmind/user_info');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('usage').textContent = '無法載入統計資料';
                } else {
                    const userCount = data.user_count || data.api_count || data.count || 0;
                    const limit = data.api_request_limit || data.limit || data.api_limit || 600;
                    document.getElementById('usage').textContent = `已使用: ${userCount} / 上限: ${limit}`;
                }
            } catch (e) {
                document.getElementById('usage').textContent = '載入失敗';
            }
        }
        loadUserInfo();
        setInterval(loadUserInfo, 30000);

        // Save dashboard datasets (combined JSON + CSV)
        async function saveDashboard() {
            const statusEl = document.getElementById('save_status');
            const btn = document.getElementById('save_button');
            try {
                btn.disabled = true;
                statusEl.textContent = '儲存中...';
                const payload = {
                    stock_id: document.getElementById('stock_id').value,
                    start_date: document.getElementById('start_date').value,
                    end_date: document.getElementById('end_date').value,
                    force_refresh: document.getElementById('force_refresh').checked
                };
                const resp = await fetch('/api/finmind/save_dashboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (resp.ok) {
                    const files = (data.files || []).map(f => f.split('/').pop()).join(', ');
                    statusEl.textContent = files ? `已存檔: ${files}` : '已存檔';
                } else {
                    statusEl.textContent = '存檔失敗: ' + (data.error || resp.status);
                }
            } catch (e) {
                console.error(e);
                statusEl.textContent = '存檔錯誤';
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', function(){
            const saveBtn = document.getElementById('save_button');
            if (saveBtn) saveBtn.addEventListener('click', saveDashboard);

            // Handle async financial summary update when stock_id changes
            const stockInput = document.getElementById('stock_id');
            const summaryContainer = document.getElementById('financial-summary-container');

            async function updateFinancialSummary() {
                const stockId = stockInput.value.trim();
                const startDate = document.getElementById('start_date').value;
                if (!stockId) return;

                try {
                    // Update summary panel with "Loading" state
                    const epsEl = document.getElementById('summary-eps');
                    const grossEl = document.getElementById('summary-gross');
                    if (epsEl) epsEl.textContent = '...';
                    if (grossEl) grossEl.textContent = '...';

                    const resp = await fetch(`/api/finmind/financial_summary/${stockId}?start_date=${startDate}`);
                    if (!resp.ok) throw new Error('Fetch failed');
                    const data = await resp.json();

                    // If container was empty (i.e. first load), create the structure
                    if (!summaryContainer.innerHTML.trim()) {
                        summaryContainer.innerHTML = `
                            <div class="financial-panel" style="display:flex; gap:20px; align-items:center; justify-content:center;">
                                <div style="padding:12px; background:#f9f9ff; border-radius:8px; text-align:center; min-width:160px; border:1px solid #e0e0ff;">
                                    <div style="font-size:0.9em; color:#666;">最新 EPS</div>
                                    <div id="summary-eps" style="font-size:1.4em; font-weight:600; margin-top:6px;">—</div>
                                </div>
                                <div style="padding:12px; background:#fff9f0; border-radius:8px; text-align:center; min-width:200px; border:1px solid #ffe0b0;">
                                    <div style="font-size:0.9em; color:#666;">最新 毛利 (Gross Profit)</div>
                                    <div id="summary-gross" style="font-size:1.2em; font-weight:600; margin-top:6px;">—</div>
                                </div>
                            </div>
                            <div id="financial-table-wrapper" style="max-width:800px; margin:15px auto 0; overflow-x: auto;">
                                <table style="width:100%; border-collapse:collapse; font-size:0.9em; background:#fff;">
                                    <thead>
                                        <tr style="background:#f8f9fa;">
                                            <th style="padding:8px; text-align:left; border-bottom:2px solid #dee2e6;">日期</th>
                                            <th style="padding:8px; text-align:right; border-bottom:2px solid #dee2e6;">EPS</th>
                                            <th style="padding:8px; text-align:right; border-bottom:2px solid #dee2e6;">毛利 (Gross Profit)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="financial-table-body"></tbody>
                                </table>
                            </div>
                        `;
                    }

                    // Update values
                    document.getElementById('summary-eps').textContent = data.latest_eps !== null ? data.latest_eps.toFixed(2) : '—';
                    document.getElementById('summary-gross').textContent = data.latest_gross !== null ? data.latest_gross.toLocaleString() : '—';
                    
                    // Update table rows
                    const tbody = document.getElementById('financial-table-body');
                    tbody.innerHTML = (data.financial_series || []).map(r => `
                        <tr style="border-bottom:1px solid #eee;">
                            <td style="padding:8px;">${r.date || ''}</td>
                            <td style="padding:8px; text-align:right;">${r.eps !== null ? r.eps.toFixed(2) : '—'}</td>
                            <td style="padding:8px; text-align:right;">${r.gross_profit !== null ? r.gross_profit.toLocaleString() : '—'}</td>
                        </tr>
                    `).join('');

                } catch (e) {
                    console.error('Failed to update financial summary', e);
                    const epsEl = document.getElementById('summary-eps');
                    if (epsEl) epsEl.textContent = 'Error';
                }
            }

            // Trigger on Blur (when user leaves input) or Enter
            if (stockInput) {
                stockInput.addEventListener('blur', updateFinancialSummary);
                stockInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        updateFinancialSummary();
                    }
                });
            }
        });
    </script>
</body>
</html>
